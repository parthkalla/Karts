+GameplayTagList=(Tag="KCF.Powerup.Rarity.Rare",DevComment="Drop-weight band used by spawners and UI colouring.")

+GameplayTagList=(Tag="KCF.Arena.Trait.Indoor",DevComment="Enclosed arena. Audio and lighting presets key off this.")
+GameplayTagList=(Tag="KCF.Arena.Trait.Outdoor",DevComment="Open arena.")
+GameplayTagList=(Tag="KCF.Arena.Trait.Hazards",DevComment="Contains environmental damage volumes.")
