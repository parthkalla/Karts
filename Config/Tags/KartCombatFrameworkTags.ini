; Kart Combat Framework - content-defined gameplay tags.
;
; Tags that C++ compares against are declared natively in KCFGameplayTags.h/.cpp and must NOT be
; repeated here. This file holds the classification tags that content uses and code only ever
; passes through: weapon and powerup categories, arena traits, and the immunity keys a designer
; can attach to a powerup without a programmer.
;
; A project adds its own tags in its own Config/Tags ini rather than editing this file, so that
; updating the plugin never conflicts with project content.

[/Script/GameplayTags.GameplayTagsSettings]
+GameplayTagList=(Tag="KCF.Weapon.Category.Projectile",DevComment="Travels through the world and damages what it hits.")
+GameplayTagList=(Tag="KCF.Weapon.Category.Hitscan",DevComment="Resolves instantly along a trace.")
+GameplayTagList=(Tag="KCF.Weapon.Category.Deployable",DevComment="Placed in the world and triggered later, e.g. a mine.")
+GameplayTagList=(Tag="KCF.Weapon.Category.Area",DevComment="Affects everything within a radius of the firing kart.")
+GameplayTagList=(Tag="KCF.Weapon.Category.Support",DevComment="Affects the firing kart rather than a target.")
+GameplayTagList=(Tag="KCF.Weapon.Trait.Homing",DevComment="Seeks a target after firing. Used by UI to warn the victim.")
+GameplayTagList=(Tag="KCF.Weapon.Trait.Explosive",DevComment="Deals radial damage on impact.")
+GameplayTagList=(Tag="KCF.Weapon.Trait.Piercing",DevComment="Passes through the first thing it hits.")
+GameplayTagList=(Tag="KCF.Weapon.Trait.Rear",DevComment="Fires behind the kart rather than ahead of it.")

+GameplayTagList=(Tag="KCF.Powerup.Category.Offensive",DevComment="Grants a weapon or an attack effect.")
